<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed sidebar + content pane; sidebar becomes a top tab strip on phones. */
:root{
  --bg:#F6F6F4; --panel:#FFFFFF; --ink:#141414; --muted:#6B6B66; --faint:#9A9A94; --line:#E4E4E0; --hover:#F0F0EC;
  --accent:#1F5EFF; --accent-ink:#FFFFFF; --accent-soft:#EAF0FF;
  --ok:#1E7A46; --ok-soft:#E6F4EC; --no:#B42318; --no-soft:#FDECEA; --amber:#A15C07; --amber-soft:#FEF3E2;
  --sans:"Geist",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0D; --panel:#171716; --ink:#EDEDEA; --muted:#A1A19B; --faint:#6E6E69; --line:#2A2A28; --hover:#1F1F1D;
  --accent:#5B8CFF; --accent-ink:#0E0E0D; --accent-soft:#1A2440;
  --ok:#4CC383; --ok-soft:#13281C; --no:#F97066; --no-soft:#2E1513; --amber:#F5B04C; --amber-soft:#2D2111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0D; --panel:#171716; --ink:#EDEDEA; --muted:#A1A19B; --faint:#6E6E69; --line:#2A2A28; --hover:#1F1F1D;
  --accent:#5B8CFF; --accent-ink:#0E0E0D; --accent-soft:#1A2440;
  --ok:#4CC383; --ok-soft:#13281C; --no:#F97066; --no-soft:#2E1513; --amber:#F5B04C; --amber-soft:#2D2111; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;background:var(--bg)}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.avatar{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 12px/1 var(--sans);background:var(--ink);color:var(--bg);flex:none}
.ws .n{font-weight:600;font-size:13.5px;line-height:1.2}
.ws .s{font-size:12px;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;box-sizing:border-box}
nav button svg{width:16px;height:16px;flex:none}
nav button:hover{background:var(--hover);color:var(--ink)}
nav button[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
nav button[disabled]{opacity:.4;cursor:not-allowed}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:8px;font-size:13px;color:var(--muted)}
.me .avatar{background:var(--hover);color:var(--ink);border-radius:50%}

main{padding:28px clamp(16px,4vw,48px) 64px;display:flex;flex-direction:column;gap:22px;max-width:1080px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:22px;font-weight:600;letter-spacing:-0.015em;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}

.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);box-sizing:border-box;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.mono{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.dim{color:var(--muted)}
.t2{font-size:12.5px;color:var(--muted)}

.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.b-no{color:var(--no);background:var(--no-soft);border-color:transparent}
.b-amber{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.b-mut{color:var(--muted)}

/* toggle */
.tg{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.tg span::after{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tg input:checked + span{background:var(--accent)}
.tg input:checked + span::after{transform:translateX(14px)}
.tg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.tg input:disabled + span{opacity:.5}
@media (prefers-reduced-motion:reduce){.tg span,.tg span::after{transition:none}}
.cb{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

.list{display:flex;flex-direction:column}
.li{display:flex;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .tt{font-weight:500}

/* form / drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);display:flex;justify-content:flex-end;z-index:10}
.drawer{width:min(440px,100%);height:100%;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dh h2{font-size:16px;font-weight:600;margin:0}
.db{padding:20px;display:flex;flex-direction:column;gap:16px;overflow:auto;flex:1}
.df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;font-weight:500}
.f input,.f select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;width:100%}
.f input:focus,.f select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.f input[readonly]{background:var(--hover);color:var(--muted)}
.x{all:unset;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;border-radius:6px}
.x:hover{background:var(--hover)}

.empty{padding:48px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink)}
.seg button:focus-visible{outline:2px solid var(--accent)}

/* assistant */
.chatwrap{display:grid;grid-template-rows:auto 1fr auto;min-height:520px}
.chathead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thread{padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:640px;padding:10px 14px;border-radius:12px;font-size:14px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--hover);border-bottom-left-radius:4px;display:flex;flex-direction:column;gap:8px}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.chip.w{border-style:dashed}
.sugg{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sugg button{all:unset;cursor:pointer;font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.sugg button:hover{background:var(--hover)}
.sugg button:focus-visible{outline:2px solid var(--accent)}
.hint{color:var(--faint);font-size:13px;text-align:center;margin:auto}
select.inline{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;z-index:20}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  nav{flex-direction:row;overflow-x:auto;gap:4px}
  nav button{white-space:nowrap}
  .me{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="ws" id="ws"></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="me"><span class="avatar">PA</span><span>Platform admin</span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(function(){
const ICONS = {
  tenants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>',
  roles:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></svg>',
  policies:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.3 7.5 9.5 4.3-1.2 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>',
  preview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  assistant:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.4 7.6L3 21l1.4-5.6A8.5 8.5 0 1 1 21 12Z"/></svg>'
};
const PAGES = [['tenants','Tenants'],['roles','Roles'],['policies','Access policies'],['preview','Access preview'],['assistant','Assistant']];

const PERMS = ['View records','Edit drafts','Submit plans','Approve plans','Configure','Use assistant'];
const S = {
  page:'tenants', created:false, drawer:false,
  tenant:{name:'Meridian Holding', id:'mrd-001', region:'UAE', models:'In-region only', hierarchy:'Group → Sector → Branch → Section'},
  roles:[
    {r:'Strategy coordinator', p:[1,1,0,1,0,1]},
    {r:'BU head', p:[1,1,1,0,0,1]},
    {r:'Plan contributor', p:[1,1,0,0,0,0]},
    {r:'Reviewer', p:[1,0,1,1,0,1]},
    {r:'Data steward', p:[1,0,0,0,1,0]},
    {r:'Administrator', p:[1,0,0,0,1,0]}
  ],
  pol:{P2:true,P3:true,P4:true,P5:false},
  viewAs:'U2', askAs:'U2', thread:[]
};
const USERS = [
  {id:'U1', n:'Sara Al Mansoori', t:'Group Strategy coordinator', role:'Strategy coordinator', scope:'Group', office:true},
  {id:'U2', n:'Omar Haddad', t:'Head of Leasing', role:'BU head', scope:'Leasing'},
  {id:'U3', n:'Priya Nair', t:'Development Director', role:'BU head', scope:'Development'},
  {id:'U4', n:'Lina Farouk', t:'Leasing analyst', role:'Plan contributor', scope:'Leasing'}
];
const CEIL = {'Strategy coordinator':2,'BU head':2,'Plan contributor':1};
const RANK = {Internal:1,Confidential:2,Restricted:3};
const RECORDS = [
  {id:'R1', n:'Group Strategy 2026–2030', scope:'Group', cls:'Internal', tenant:'mrd'},
  {id:'R2', n:'Land acquisition targets', scope:'Group', cls:'Restricted', tenant:'mrd'},
  {id:'R3', n:'FY2026 Development plan', scope:'Development', cls:'Internal', tenant:'mrd'},
  {id:'R4', n:'Tower B cost report, Q2', scope:'Development', cls:'Confidential', tenant:'mrd'},
  {id:'R5', n:'FY2026 Leasing plan', scope:'Leasing', cls:'Internal', tenant:'mrd'},
  {id:'R6', n:'Tenant rent roll', scope:'Leasing', cls:'Confidential', tenant:'mrd'},
  {id:'R7', n:'FY2027 Hospitality plan', scope:'Group', cls:'Internal', tenant:'aln'}
];
const POLICIES = [
  {id:'P1', t:'Tenant isolation', d:'Users and the assistant only access records in their own tenant.', locked:true},
  {id:'P2', t:'Hierarchy scope', d:'Users see records in their own sector and at group level. Group Strategy sees all sectors.'},
  {id:'P3', t:'Classification ceiling', d:'Plan contributors up to Internal. BU heads and coordinators up to Confidential.'},
  {id:'P4', t:'Restricted records', d:'Restricted records are visible to the Group Strategy office only.'},
  {id:'P5', t:'Cross-sector plan access', d:'BU heads can read Internal plans from other sectors.'}
];
const QS = [
  {q:'What did the FY2026 Leasing plan say about occupancy?', need:['R5'], a:'Average occupancy reached 84% against a target of 88%. The gap was mainly in older community retail.'},
  {q:'Summarise the Tower B cost position.', need:['R4'], a:'Tower B is 6.2% over its approved budget, driven by the façade and MEP packages. A recovery plan is due in Q3.'},
  {q:'Which land is the group targeting next?', need:['R2'], a:'Three priority plots in the Marina District extension, with the first acquisition targeted for Q1 2027.'},
  {q:'How does our occupancy compare with the Hospitality plan?', need:['R5','R7'], a:''}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U = id=>USERS.find(u=>u.id===id);
const roleOf = name=>S.roles.find(r=>r.r===name);

function access(u,r){
  if(r.tenant!=='mrd') return {ok:false, why:'Different tenant'};
  if(r.cls==='Restricted'){ if(S.pol.P4 && u.office) return {ok:true}; return {ok:false, why:'Restricted'}; }
  if(S.pol.P3 && RANK[r.cls] > CEIL[u.role]) return {ok:false, why:'Above classification ceiling'};
  if(S.pol.P2){
    const inScope = r.scope==='Group' || u.scope==='Group' || r.scope===u.scope;
    const cross = S.pol.P5 && u.role==='BU head' && r.cls==='Internal';
    if(!inScope && !cross) return {ok:false, why:'Outside sector'};
  }
  if(!roleOf(u.role).p[0]) return {ok:false, why:'Role cannot view records'};
  return {ok:true};
}
const clsBadge = c=>`<span class="badge ${c==='Restricted'?'b-no':c==='Confidential'?'b-amber':'b-mut'}">${c}</span>`;
const initials = n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');

function ws(){
  $('#ws').innerHTML = S.created
    ? `<span class="avatar">MH</span><div><div class="n">${esc(S.tenant.name)}</div><div class="s">${esc(S.tenant.id)} · ${esc(S.tenant.region)}</div></div>`
    : `<span class="avatar">—</span><div><div class="n">No tenant selected</div><div class="s">Platform</div></div>`;
}
function nav(){
  $('#nav').innerHTML = PAGES.map(([k,l])=>`<button type="button" data-page="${k}" ${S.page===k?'aria-current="page"':''} ${(!S.created&&k!=='tenants')?'disabled':''}>${ICONS[k]}<span>${l}</span></button>`).join('');
}
function header(t,sub,actions){ return `<div class="ph"><div><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions||''}</div>`; }

const VIEW = {
  tenants(){
    const rows = [
      `<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="avatar">AN</span><div><div>Al Noor Hospitality</div><div class="mono">aln-001</div></div></div></td><td>KSA</td><td>In-region only</td><td>14</td><td><span class="badge b-ok"><span class="dot"></span>Active</span></td></tr>`
    ];
    if(S.created) rows.push(`<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="avatar">MH</span><div><div>${esc(S.tenant.name)}</div><div class="mono">${esc(S.tenant.id)}</div></div></div></td><td>${esc(S.tenant.region)}</td><td>${esc(S.tenant.models)}</td><td>4</td><td><span class="badge b-ok"><span class="dot"></span>Active</span></td></tr>`);
    return header('Tenants','Each organisation is isolated: its own data, users and policies.', `<button class="btn primary" data-act="new" ${S.created?'disabled':''}>New tenant</button>`)+
      `<div class="card tbl"><table style="min-width:620px"><thead><tr><th>Organisation</th><th>Data region</th><th>AI models</th><th>Users</th><th>Status</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  },
  roles(){
    const agentRow = `<tr><td><div>Assistant</div><div class="t2">Inherits the requesting user's permissions</div></td>${PERMS.map(()=>`<td class="c dim">—</td>`).join('')}</tr>`;
    return header('Roles','What each role can do. Changes apply immediately.')+
      `<div class="card tbl"><table style="min-width:760px"><thead><tr><th>Role</th>${PERMS.map(p=>`<th class="c">${p}</th>`).join('')}</tr></thead><tbody>
      ${S.roles.map((r,i)=>`<tr><td>${r.r}</td>${r.p.map((v,j)=>`<td class="c"><input class="cb" type="checkbox" id="perm-${i}-${j}" aria-label="${esc(r.r)}: ${PERMS[j]}" data-perm="${i}:${j}" ${v?'checked':''}></td>`).join('')}</tr>`).join('')}
      ${agentRow}</tbody></table></div>
      <div class="card tbl"><table style="min-width:560px"><thead><tr><th>User</th><th>Title</th><th>Role</th><th>Scope</th></tr></thead><tbody>
      ${USERS.map(u=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="avatar" style="border-radius:50%;background:var(--hover);color:var(--ink)">${initials(u.n)}</span>${esc(u.n)}</div></td><td class="dim">${esc(u.t)}</td><td>${u.role}</td><td>${u.scope==='Group'?'Group':u.scope+' sector'}</td></tr>`).join('')}
      </tbody></table></div>`;
  },
  policies(){
    return header('Access policies','Which records users and the assistant can access.')+
      `<div class="card list">${POLICIES.map(p=>`<div class="li"><div class="grow"><div class="tt">${p.t}</div><div class="t2">${p.d}</div></div>
        <label class="tg" for="pol-${p.id}"><input type="checkbox" id="pol-${p.id}" data-pol="${p.id}" ${p.locked||S.pol[p.id]?'checked':''} ${p.locked?'disabled':''} aria-label="${p.t}"><span></span></label></div>`).join('')}</div>
      <div class="card tbl"><table style="min-width:520px"><thead><tr><th>Record</th><th>Owner</th><th>Classification</th></tr></thead><tbody>
      ${RECORDS.filter(r=>r.tenant==='mrd').map(r=>`<tr><td>${r.n}</td><td class="dim">${r.scope==='Group'?'Group':r.scope+' sector'}</td><td>${clsBadge(r.cls)}</td></tr>`).join('')}</tbody></table></div>`;
  },
  preview(){
    const u = U(S.viewAs);
    const recs = RECORDS.filter(r=>r.tenant==='mrd');
    const n = recs.filter(r=>access(u,r).ok).length;
    return header('Access preview','See exactly what a user can access.')+
      `<div class="toolbar"><div class="seg" role="group" aria-label="View as">${USERS.map(x=>`<button type="button" data-viewas="${x.id}" aria-pressed="${x.id===S.viewAs}">${esc(x.t)}</button>`).join('')}</div><span class="t2">${n} of ${recs.length} records</span></div>
      <div class="card tbl"><table style="min-width:560px"><thead><tr><th>Record</th><th>Classification</th><th>Access</th><th>Reason</th></tr></thead><tbody>
      ${recs.map(r=>{const a=access(u,r);return `<tr><td${a.ok?'':' class="dim"'}>${r.n}</td><td>${clsBadge(r.cls)}</td><td>${a.ok?'<span class="badge b-ok"><span class="dot"></span>Allowed</span>':'<span class="badge b-no"><span class="dot"></span>Denied</span>'}</td><td class="t2">${a.ok?'':esc(a.why)}</td></tr>`;}).join('')}
      </tbody></table></div>`;
  },
  assistant(){
    const u = U(S.askAs);
    const thread = S.thread.length ? S.thread.map(m=> m.u
      ? `<div class="msg u">${esc(m.text)}</div>`
      : `<div class="msg a"><div>${m.html}</div>${m.srcs?`<div class="srcs">${m.srcs}</div>`:''}</div>`).join('')
      : `<p class="hint">Ask a question to get started.</p>`;
    return header('Assistant','Answers only from records the person asking can access.')+
      `<div class="card chatwrap">
        <div class="chathead"><span class="t2">Asking as</span><select class="inline" id="askas" aria-label="Asking as">${USERS.map(x=>`<option value="${x.id}" ${x.id===S.askAs?'selected':''}>${esc(x.n)} · ${esc(x.t)}</option>`).join('')}</select>
        ${S.thread.length?'<button class="btn" data-act="clear" style="margin-left:auto">Clear</button>':''}</div>
        <div class="thread" id="thread">${thread}</div>
        <div class="sugg">${QS.map((x,i)=>`<button type="button" data-q="${i}">${esc(x.q)}</button>`).join('')}</div>
      </div>`;
  }
};

function answer(i){
  const u = U(S.askAs), Q = QS[i];
  S.thread.push({u:true, text:Q.q});
  if(!roleOf(u.role).p[5]){
    S.thread.push({html:'Your role doesn’t include access to the assistant. Ask your administrator.'}); return;
  }
  const checks = Q.need.map(id=>{const r=RECORDS.find(x=>x.id===id); return {r, a:access(u,r)};});
  const ok = checks.filter(c=>c.a.ok), denied = checks.filter(c=>!c.a.ok);
  let html;
  if(i===3){
    html = (ok.length?'FY2026 occupancy was 84% against an 88% target. ':'')+'I can’t compare with the Hospitality plan, because it belongs to another organisation.';
  } else if(denied.length){
    html = 'I can’t help with that. The information is in a record you don’t have access to.';
  } else html = Q.a;
  const srcs = ok.map(c=>`<span class="chip">${esc(c.r.n)}</span>`).join('') + (denied.length?`<span class="chip w">${denied.length} source${denied.length>1?'s':''} withheld</span>`:'');
  S.thread.push({html, srcs});
}

function drawer(){
  if(!S.drawer){ $('#layer').innerHTML=''; return; }
  const t = S.tenant;
  $('#layer').innerHTML = `<div class="scrim" data-act="close"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <div class="dh"><h2 id="dtitle">New tenant</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <div class="db">
      <div class="f"><label for="f-name">Organisation name</label><input id="f-name" value="${esc(t.name)}"></div>
      <div class="f"><label for="f-id">Tenant ID</label><input id="f-id" value="${esc(t.id)}" readonly></div>
      <div class="f"><label for="f-region">Data region</label><select id="f-region">${['UAE','KSA','EU'].map(x=>`<option ${x===t.region?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label for="f-models">AI models</label><select id="f-models">${['In-region only','Any approved'].map(x=>`<option ${x===t.models?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="f"><label for="f-h">Hierarchy</label><input id="f-h" value="${esc(t.hierarchy)}"></div>
    </div>
    <div class="df"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="create">Create tenant</button></div>
  </div></div>`;
  const f=$('#f-name'); if(f) f.focus();
}
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }

function render(){ ws(); nav(); $('#main').innerHTML = VIEW[S.page](); drawer(); const th=$('#thread'); if(th) th.lastElementChild && th.lastElementChild.scrollIntoView({block:'nearest'}); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-act]'); if(!b) return;
  if(b.classList.contains('scrim') && e.target!==b) return;
  const a = b.dataset.act;
  if(b.dataset.page){ if(!b.disabled){ S.page=b.dataset.page; render(); } return; }
  if(a==='new'){ S.drawer=true; drawer(); return; }
  if(a==='close'){ S.drawer=false; drawer(); return; }
  if(a==='create'){
    S.tenant.name=$('#f-name').value.trim()||'Meridian Holding'; S.tenant.region=$('#f-region').value; S.tenant.models=$('#f-models').value; S.tenant.hierarchy=$('#f-h').value;
    S.created=true; S.drawer=false; render(); toast('Tenant created'); return;
  }
  if(a==='clear'){ S.thread=[]; render(); return; }
  if(b.dataset.viewas){ S.viewAs=b.dataset.viewas; render(); return; }
  if(b.dataset.q!==undefined){ answer(+b.dataset.q); render(); return; }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.pol){ S.pol[t.dataset.pol]=t.checked; render(); toast('Policy updated'); return; }
  if(t.dataset.perm){ const [i,j]=t.dataset.perm.split(':').map(Number); S.roles[i].p[j]=t.checked?1:0; toast('Role updated'); return; }
  if(t.id==='askas'){ S.askAs=t.value; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.drawer){ S.drawer=false; drawer(); } });
render();
})();
</script>
</body>
</html>
